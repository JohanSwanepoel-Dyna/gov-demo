apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-stub
spec:
  replicas: 1
  selector:
    matchLabels: {app: legacy-stub}
  template:
    metadata:
      labels: {app: legacy-stub}
    spec:
      containers:
        - name: legacy-stub
          image: gov-demo/legacy-stub:dev
          imagePullPolicy: IfNotPresent
          securityContext: {runAsUser: 10001, runAsNonRoot: true}
          ports:
            - containerPort: 8300
            - containerPort: 8301
          env:
            - {name: JAVA_OPTS, value: "-Xmx384m"}
            - {name: CONTROL_TOKEN, valueFrom: {secretKeyRef: {name: gov-demo-env, key: CONTROL_TOKEN}}}
          startupProbe:
            httpGet: {path: /healthz, port: 8301}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: /healthz, port: 8301}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8301}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 384Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-stub
spec:
  type: ClusterIP
  selector: {app: legacy-stub}
  ports:
    - name: http
      port: 8300
      targetPort: 8300
    - name: control
      port: 8301
      targetPort: 8301
