x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-db-url: &db-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
  postgres:
    logging: *logging
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  seed:
    logging: *logging
    build: ./db
    environment:
      DATABASE_URL: *db-url
      CREDENTIALS_CSV: /out/credentials.csv
    volumes:
      - ./db/out:/out
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  legacy-stub:
    logging: *logging
    build: ./services/legacy-stub
    environment:
      CONTROL_TOKEN: ${CONTROL_TOKEN}
    ports: ["8300:8300", "8301:8301"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8301 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  retention:
    build: ./db
    command: ["python", "retention.py", "--loop", "900"]
    environment:
      DATABASE_URL: *db-url
      RETENTION_HOURS: "6"
    depends_on:
      seed:
        condition: service_completed_successfully
    logging: *logging

  claims-api:
    logging: *logging
    build: ./services/claims-api
    environment:
      DATABASE_URL: *db-url
      CONTROL_TOKEN: ${CONTROL_TOKEN}
    ports: ["8000:8000"]
    depends_on:
      seed:
        condition: service_completed_successfully
      legacy-stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz',timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  llm-gateway:
    logging: *logging
    build: ./services/llm-gateway
    environment:
      CONTROL_TOKEN: ${CONTROL_TOKEN}
    ports: ["8100:8100"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/healthz',timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  payment-worker:
    logging: *logging
    build: ./services/payment-worker
    environment:
      DATABASE_URL: *db-url
      CONTROL_TOKEN: ${CONTROL_TOKEN}
    ports: ["8200:8200"]
    depends_on:
      seed:
        condition: service_completed_successfully
      legacy-stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8200/healthz',timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    logging: *logging
    build: ./services/web
    ports: ["8080:8080"]
    depends_on:
      claims-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  locust:
    logging: *logging
    build: ./load/locust
    environment:
      CONTROL_TOKEN: ${CONTROL_TOKEN}
      LOAD_PROFILE: baseline
    ports: ["8089:8089"]
    volumes:
      - ./db/out:/data:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8089/',timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
