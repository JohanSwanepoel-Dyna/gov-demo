# SLO for the Carer Support Portal demo. The window is 2 hours so a burn shows up quickly in a demo; use now-7d for a realistic window. Create with: dtctl create slo -f docs/slos/claim-submission-availability.yaml
name: "Carer portal: claim submission availability"
description: "Share of claim submissions that did not fail with a server error. Stays green in monday_peak because submitting only queues the payment."
customSli:
  indicator: |-
      fetch spans
      | filter service.name == "claims-api" and span.kind == "server" and span.name == "POST /api/claims/{claim_id}/submit"
      | makeTimeseries { total = count(), failed = countIf(http.response.status_code >= 500) }, interval: 5m
      | fieldsAdd sli = (total[] - failed[]) * 100.0 / total[]
criteria:
  - timeframeFrom: now-2h
    timeframeTo: now
    target: 99
    warning: 99.5
